trigger: none

pool: 
    name: dhruvagent

stages:
- stage: PreCommit
  displayName: terraform install
  jobs: 
  - job: Terraforminstall
    steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest' 

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/ENV/DEV'
            backendServiceArm: 'dhruv-app'
            backendAzureRmStorageAccountName: 'statestg'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'wee.terraform.tfstate'
        


        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/ENV/DEV'



        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/ENV/DEV'
            environmentServiceNameAzureRM: 'dhruv-app'
        
